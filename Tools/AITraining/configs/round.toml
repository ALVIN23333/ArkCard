# ArkCard AI pipeline configuration template.
# Copy this file per round (e.g. configs/round2.toml) and never overwrite past rounds.
# All paths are relative to the detected project root unless absolute.

[project]
unity = "D:/unity/2022.3.62f3c1/Editor/Unity.exe"

[round]
modelVersion = "self-play-r001-candidate-002"
seed = 20260806
runDir = "Tools/runs/self-play-r001-candidate-002"   # default: Tools/runs/<modelVersion>

[teacher]                                            # tool 1: generate-teacher
samples = 100000
shardSamples = 2048
maxMatches = 10000
maxPlies = 256
deckMatrix = "all"                                   # "all" or e.g. "0,1"; empty keeps -aiFirstDeck/-aiSecondDeck
# firstDeck = 0
# secondDeck = 1
output = "Artifacts/AI/Datasets/teacher-v2"
prefix = "legacy-teacher-v2"

[data]                                               # tool 2 data step (mode = teacher | selfplay | skip)
mode = "skip"
selfplayOutput = "Artifacts/AI/Datasets/self-play-r002"
selfplayPrefix = "neural-self-play-r002"
modelConfig = "Assets/AI/Configs/DefaultAIModelConfig.asset"

[train]                                              # tool 2 training step / tool 3
datasets = ["Artifacts/AI/Datasets/teacher-v1", "Artifacts/AI/Datasets/self-play-r001"]
output = ""                                          # default: <runDir>
epochs = 40
batchSize = 64
shuffleBuffer = 4096
learningRate = 3e-4
weightDecay = 1e-4
valueWeight = 1.0
device = "cuda"
amp = true
validationFraction = 0.1
prefetchBuffer = 2048
resume = "Tools/runs/teacher-v1-001/teacher-v1-001.pt"

[export]                                             # tool 3 export
checkpoint = ""                                      # default: <runDir>/best.pt
output = ""                                          # default: Tools/exports/<modelVersion>
parityRecords = ["Artifacts/AI/Datasets/self-play-r001"]

[candidate]                                          # tool 3 staging
skipTrain = false
modelsDir = "Assets/AI/Models/Candidate"
configPath = "Assets/AI/Configs/CandidateAIModelConfig.asset"

[arena]                                              # tool 4
candidateConfig = "Assets/AI/Configs/CandidateAIModelConfig.asset"
championConfig = "Assets/AI/Configs/DefaultAIModelConfig.asset"
smokeGames = 20
games = 1000
minimumGames = 1000
minimumScoreRate = 0.55
maximumP95Ms = 50.0
reportDir = "Artifacts/AI/Reports"
